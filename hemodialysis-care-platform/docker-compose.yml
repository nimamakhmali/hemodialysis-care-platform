version: '3.8'

services:
  # ==========================================
  # Database (PostgreSQL)
  # ==========================================
  db:
    image: postgres:15-alpine
    container_name: hemodialysis_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hemo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hemo_password}
      POSTGRES_DB: ${POSTGRES_DB:-hemodialysis_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./hemodialysis-backend/scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hemo_user} -d ${POSTGRES_DB:-hemodialysis_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hemodialysis_network

  # ==========================================
  # Redis (Cache & Celery Broker)
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: hemodialysis_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hemodialysis_network

  # ==========================================
  # Backend API (FastAPI)
  # ==========================================
  backend:
    build:
      context: ./hemodialysis-backend
      dockerfile: Dockerfile
    container_name: hemodialysis_backend
    restart: unless-stopped
    env_file:
      - ./hemodialysis-backend/.env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql://${POSTGRES_USER:-hemo_user}:${POSTGRES_PASSWORD:-hemo_password}@db:5432/${POSTGRES_DB:-hemodialysis_db}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      ALLOWED_ORIGINS: http://localhost:8090,http://localhost:3000
      ENVIRONMENT: production
      DEBUG: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --workers 4
    networks:
      - hemodialysis_network

  # ==========================================
  # Celery Worker (Background Tasks)
  # ==========================================
  celery_worker:
    build:
      context: ./hemodialysis-backend
      dockerfile: Dockerfile
    container_name: hemodialysis_celery_worker
    restart: unless-stopped
    env_file:
      - ./hemodialysis-backend/.env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql://${POSTGRES_USER:-hemo_user}:${POSTGRES_PASSWORD:-hemo_password}@db:5432/${POSTGRES_DB:-hemodialysis_db}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      ENVIRONMENT: production
      DEBUG: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    command: celery -A app.tasks.celery_app worker --loglevel=info --queues=analysis,notification
    networks:
      - hemodialysis_network

  # ==========================================
  # Celery Beat (Scheduled Tasks)
  # ==========================================
  celery_beat:
    build:
      context: ./hemodialysis-backend
      dockerfile: Dockerfile
    container_name: hemodialysis_celery_beat
    restart: unless-stopped
    env_file:
      - ./hemodialysis-backend/.env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql://${POSTGRES_USER:-hemo_user}:${POSTGRES_PASSWORD:-hemo_password}@db:5432/${POSTGRES_DB:-hemodialysis_db}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      ENVIRONMENT: production
      DEBUG: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    command: celery -A app.tasks.celery_app beat --loglevel=info
    networks:
      - hemodialysis_network

  # ==========================================
  # Frontend (Next.js)
  # ==========================================
  frontend:
    build:
      context: ./hemodialysis-frontend
      dockerfile: Dockerfile
    container_name: hemodialysis_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:8090/api/v1}
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - hemodialysis_network

  # ==========================================
  # Nginx Reverse Proxy (Port 8090)
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: hemodialysis_nginx
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - hemodialysis_network

volumes:
  postgres_data:
  redis_data:

networks:
  hemodialysis_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16