version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hemodialysis_app
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    networks:
      - hemodialysis_network

  db:
    image: postgres:15-alpine
    container_name: hemodialysis_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hemo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hemo_password}
      POSTGRES_DB: ${POSTGRES_DB:-hemodialysis_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hemo_user} -d ${POSTGRES_DB:-hemodialysis_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - hemodialysis_network

  redis:
    image: redis:7-alpine
    container_name: hemodialysis_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - hemodialysis_network

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hemodialysis_celery
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app worker --loglevel=info --queues=analysis,notification
    restart: unless-stopped
    networks:
      - hemodialysis_network

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hemodialysis_celery_beat
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app beat --loglevel=info
    restart: unless-stopped
    networks:
      - hemodialysis_network

volumes:
  postgres_data:
  redis_data:

networks:
  hemodialysis_network:
    driver: bridge